name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan for Secrets in Code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan filesystem for verified secrets
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo:ro" \
            ghcr.io/trufflesecurity/trufflehog:3.82.13 \
            filesystem /repo --only-verified --fail --no-update
