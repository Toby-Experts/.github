name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruff
        run: pip install ruff
      - name: Check Python style
        run: ruff check scripts
      - name: Check Python formatting
        run: ruff format --check scripts
      - name: Check workflow hygiene
        run: python scripts/check_workflow_hygiene.py
      - name: Check workflow hygiene self-test
        run: python scripts/check_workflow_hygiene.py --self-test
      - name: Check pull request origin self-test
        run: python scripts/check_pull_request_origin.py --self-test
